[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inner-speech-eeg-analysis"
version = "0.1.0"
description = "Auditable task/rest EEG connectivity and grouped CSP evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12", "mne>=1.8,<2", "mne-connectivity>=0.7,<0.8", "scikit-learn>=1.6,<2", "pandas>=2", "PyYAML>=6", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5", "ipykernel>=6"]

[project.scripts]
inner-speech = "inner_speech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
