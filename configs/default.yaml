# Paths are relative to this YAML file. Override locally; never commit EEG data.
dataset_root: ../data/ds003626
output_root: ../results/generated
subjects: [sub-01, sub-02, sub-03, sub-04, sub-05, sub-06, sub-07, sub-08, sub-09, sub-10]
sessions: [ses-01, ses-02, ses-03]
condition: inner
seed: 42
preprocessing:
  scratch_dir: null  # OS temporary directory; allow ~3 GiB per recording
  sfreq: 256
  l_freq: 1.0
  h_freq: 40.0
  notch: [50.0]
  reference: average
  bad_channels: []
  reject_peak_to_peak_uv: 200.0
  flat_peak_to_peak_uv: 0.1
  ica:
    enabled: true
    n_components: 0.99
    max_iter: 500
    eog_channels: [EXG3, EXG4, EXG5, EXG6]
    exclude: []
windows:
  # Marker 44 starts action, 45 ends action, 46 starts inter-trial rest.
  # These are marker-relative windows, NOT relative to direction codes 31-34.
  task: [0.5, 1.5]
  rest: [0.25, 1.25]
connectivity:
  bands:
    alpha: [8.0, 13.0]
  methods: [wpli2_debiased, coh, plv]
  min_trials: 20
  min_cycles: 5
  mt_bandwidth: 4.0
statistics:
  min_subjects: 5
  n_permutations: all
  bootstrap_samples: 2000
  # All configured bands, methods and edges form ONE max-T family.
classification:
  classifier: lda
  n_components: 4
  # Each held-out run is independent of all training runs (within participant).
  min_groups: 2
